name: Conda CI
on: [pull_request, push]

jobs:
  run-tests:
    name: run-tests (fenics-dolfinx v${{ matrix.dolfinx }})
    runs-on: ubuntu-24.04

    # conda-forge's MPICH uses the UCX netmod, which probes RDMA devices during
    # MPI_Init. Some Azure runners expose a MANA verbs device (mana_0) that UCX
    # fails to open, aborting the process with SIGTERM (exit 143). Restricting
    # UCX to TCP/shared-memory/self skips that probe.
    #
    # Plot tests render with no X server: with no display, VTK falls back to EGL
    # on conda-forge's software Mesa (mesalib, llvmpipe). This replaces Xvfb from
    # apt, which made the job wait on Ubuntu's mirrors before any test ran.
    env:
      UCX_TLS: tcp,self,sm
      PYVISTA_OFF_SCREEN: "true"

    strategy:
      fail-fast: false
      matrix:
        dolfinx: ['0.10.0', '0.11.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: myenv
        miniforge-version: latest
        # use-mamba: true
        channels: conda-forge

    - name: Create Conda environment
      shell: bash -l {0}
      run: |
        conda install -c conda-forge python pip fenics-dolfinx=${{ matrix.dolfinx }} scifem io4dolfinx "h5py=*=mpi_*" pyvista mesalib nanobind

    - name: Install local package and dependencies
      shell: bash -l {0}
      run: |
        python3 -m pip install scikit-build-core
        python3 -m pip install .[test] --no-build-isolation

    - name: Run tests
      shell: bash -l {0}
      run: |
        # conda-forge's libEGL looks for vendor files under $CONDA_PREFIX/etc and
        # $CONDA_PREFIX/usr/share, but mesalib installs its file to
        # $CONDA_PREFIX/share, so EGL never finds Mesa: VTK gets no OpenGL context
        # and segfaults on the first render. Point the loader at it explicitly.
        export __EGL_VENDOR_LIBRARY_DIRS="$CONDA_PREFIX/share/glvnd/egl_vendor.d"
        pytest test/ --cov festim --cov-report xml --cov-report term
    
    - name: Upload to codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
