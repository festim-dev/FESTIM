name: Lint

on: [pull_request]

# a newer push to the same branch or PR cancels the run it replaces; runs on
# main are never cancelled, so every merged commit gets a full CI result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install mypy ruff

      - name: ruff format
        run: |
          ruff format --check .

      - name: ruff check
        continue-on-error: true
        run: |
          ruff check .

      - name: mypy
        continue-on-error: true
        run: |
          python -m mypy .
