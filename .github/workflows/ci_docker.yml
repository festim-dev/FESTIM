name: Docker CI
on: [pull_request, push]

jobs:
  run-tests:
    name: run-tests (fenics-dolfinx ${{ matrix.container_version }})
    # pinned to a known host; note apt below runs in the container, whose own
    # Ubuntu release comes from the dolfinx image, not from this runner
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container_version: [v0.10.0, v0.11.0, nightly]
    container: dolfinx/dolfinx:${{ matrix.container_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Install local package and dependencies
        run: |
          python -m pip install pyvista
          python3 -m pip install .[test] --no-build-isolation

      - name: Overload io4dolfinx
      #   if: ${{ matrix.container_version == 'nightly' }}
        run: python3 -m pip install git+https://github.com/scientificcomputing/io4dolfinx.git --no-build-isolation

      # the .vtkhdf writer goes through h5py and needs the MPI build to write from
      # more than one process; surface it here rather than in a confusing test failure
      - name: Report h5py MPI support
        run: python3 -c "import h5py; print('h5py', h5py.__version__, 'mpi:', h5py.get_config().mpi)"

      - name: Install additional dependencies
        run: |
          # the container (not the runner) decides the distro: the nightly image is
          # Ubuntu 26.04, where apt's unprivileged _apt download sandbox fails to
          # resolve the mirrors even though DNS works for root (pip reached GitHub
          # above). Show what root resolves, so a real outage is easy to tell apart.
          cat /etc/os-release | grep PRETTY_NAME
          getent hosts archive.ubuntu.com || echo "root cannot resolve archive.ubuntu.com"
          # - download as root: the container is throwaway and we already run as root
          # - fail at update if any index can't be fetched, not later at install
          # - retry, and give up on a stalled mirror rather than hanging
          APT_OPTS="-o APT::Sandbox::User=root -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          apt-get update $APT_OPTS -o APT::Update::Error-Mode=any
          apt-get install -y $APT_OPTS xvfb libgl1 libglx-mesa0 libxrender1 libxcursor1 libxinerama1 curl gnupg ca-certificates

      - name: Run tests
        run: |
          xvfb-run -a python3 -m pytest test/ --cov festim --cov-report xml --cov-report term
      
      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: dolfinx-${{ matrix.container_version }}
